app = "terra-rossa-server"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  ALLOWED_ORIGINS = "https://terra-rossa.pages.dev"
  SERVICE_NAME = "terra-rossa-server"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 120

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
